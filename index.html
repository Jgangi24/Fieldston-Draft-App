<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fieldston Core Four — Draft App</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    color-scheme: light dark;
    --bg: #0f1115;
    --card: #1a1d24;
    --border: #2a2e37;
    --text: #e8e9ec;
    --muted: #9aa0ab;
    --accent: #4f8cff;
    --accent-hover: #6ba0ff;
    --error: #ff6b6b;
    --success: #4fdb8a;
    --warning: #ff9f43;
    --warning-hover: #ffb268;
    --star: #ffd166;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 48px 16px;
  }
  /* Launch splash — sits above everything (higher than the Draft Room's
     z-index:100) and is purely a visual layer: it never gates the actual
     sign-in/data-loading flow underneath, just fades out on its own. */
  .splash-screen {
    position: fixed;
    inset: 0;
    z-index: 300;
    background: var(--bg);
    cursor: pointer;
    transition: opacity 0.4s ease;
  }
  .splash-screen picture, .splash-screen img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .splash-screen.hidden {
    opacity: 0;
    pointer-events: none;
  }
  .card {
    width: 100%;
    max-width: 560px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 32px;
  }
  /* Once signed in, drop the centered-form-card look in favor of a
     full-bleed shell — matches the Draft Room's own full-screen takeover
     so stepping between "browsing drafts" and "inside a draft" feels like
     one continuous app instead of two different ones. */
  .card.signed-in {
    position: fixed;
    inset: 0;
    max-width: none;
    background: var(--bg);
    border: none;
    border-radius: 0;
    padding: 20px 16px 32px;
    overflow-y: auto;
  }
  /* The card's own background/positioning goes full-bleed above, but the
     content itself stays a readable column width — otherwise things like
     the full-width "Enter Draft Room" button stretch edge-to-edge on a
     wide desktop window. */
  #appView {
    max-width: 640px;
    margin: 0 auto;
  }
  h1 {
    font-size: 20px;
    margin: 0 0 4px;
  }
  .subtitle {
    color: var(--muted);
    font-size: 13px;
    margin: 0 0 24px;
  }
  label {
    display: block;
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 6px;
  }
  input {
    width: 100%;
    padding: 10px 12px;
    margin-bottom: 16px;
    background: #0f1115;
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 14px;
  }
  input:focus {
    outline: none;
    border-color: var(--accent);
  }
  button {
    width: 100%;
    padding: 11px;
    background: var(--accent);
    border: none;
    border-radius: 8px;
    color: white;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  button:hover { background: var(--accent-hover); }
  button:disabled { opacity: 0.5; cursor: default; }
  button.secondary {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
    margin-top: 12px;
  }
  button.secondary:hover { background: var(--border); }
  .msg {
    font-size: 13px;
    margin-top: 14px;
    padding: 10px 12px;
    border-radius: 8px;
    display: none;
  }
  .msg.error { display: block; background: rgba(255,107,107,0.1); color: var(--error); border: 1px solid rgba(255,107,107,0.3); }
  .msg.success { display: block; background: rgba(79,219,138,0.1); color: var(--success); border: 1px solid rgba(79,219,138,0.3); }
  .status-dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    margin-right: 6px;
  }
  .status-dot.ok { background: var(--success); }
  .status-dot.pending { background: var(--muted); }
  .status-dot.error { background: var(--error); }
  .status-line {
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 24px;
    display: flex;
    align-items: center;
  }
  #loginView, #appView { display: none; }
  .app-header {
    margin-bottom: 16px;
  }
  .app-header-top {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    margin-bottom: 10px;
  }
  .header-logout {
    width: auto;
    padding: 7px 14px;
    font-size: 12px;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
  }
  .header-logout:hover { background: var(--border); }
  .app-header-user {
    display: flex;
    align-items: baseline;
    gap: 8px;
  }
  .app-header-user .name {
    font-size: 20px;
    font-weight: 700;
  }
  .app-header-user .email {
    font-size: 12px;
    color: var(--muted);
  }
  .league-loading, .league-error {
    font-size: 13px;
    color: var(--muted);
    text-align: center;
    padding: 12px 0;
  }
  .you-badge {
    font-size: 10px;
    font-weight: 700;
    background: var(--accent);
    color: white;
    padding: 2px 7px;
    border-radius: 999px;
  }
  select {
    width: 100%;
    padding: 10px 12px;
    margin-bottom: 16px;
    background: #0f1115;
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 14px;
  }
  select:focus { outline: none; border-color: var(--accent); }
  /* Plain button/menu markup standing in for a native <select> — iOS
     Safari renders <option> lists with its own system picker that ignores
     page CSS entirely, so a real select can't be themed to match the app. */
  .custom-select { position: relative; margin-bottom: 16px; }
  .custom-select-toggle {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 10px 12px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 14px;
    font-weight: 400;
    text-align: left;
  }
  .custom-select-toggle:hover { background: #232631; }
  .custom-select-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .custom-select-chevron { width: 16px; height: 16px; flex-shrink: 0; color: var(--muted); transition: transform 0.15s; }
  .custom-select.open .custom-select-chevron { transform: rotate(180deg); }
  .custom-select-menu {
    display: none;
    position: absolute;
    top: calc(100% + 4px);
    left: 0;
    right: 0;
    z-index: 200;
    max-height: 240px;
    overflow-y: auto;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  }
  .custom-select.open .custom-select-menu { display: block; }
  .custom-select-option {
    width: 100%;
    display: block;
    text-align: left;
    padding: 10px 12px;
    background: none;
    border: none;
    border-radius: 0;
    color: var(--text);
    font-size: 14px;
    font-weight: 400;
    cursor: pointer;
  }
  .custom-select-option:hover { background: var(--border); }
  .custom-select-option.selected { color: var(--accent); font-weight: 600; }
  .section-title {
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--muted);
    margin: 0 0 12px;
    padding-top: 20px;
    border-top: 1px solid var(--border);
  }
  .drafts:empty { display: none; }
  .draft-card {
    background: #0f1115;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 14px;
    margin-bottom: 10px;
  }
  .draft-card .draft-label {
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 4px;
  }
  .draft-card .draft-meta {
    font-size: 12px;
    color: var(--muted);
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: center;
  }
  .pick-order-list {
    margin: 10px 0 0;
    padding-left: 20px;
    font-size: 12px;
    color: var(--muted);
  }
  .pick-order-list li {
    padding: 3px 0;
  }
  .status-pill {
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    padding: 2px 8px;
    border-radius: 999px;
    background: var(--border);
    color: var(--text);
  }
  .status-pill.setup { background: rgba(79,140,255,0.18); color: var(--accent); }
  .status-pill.in_progress { background: rgba(79,219,138,0.18); color: var(--success); }
  .status-pill.paused { background: rgba(255,107,107,0.1); color: var(--error); }
  .status-pill.completed { background: var(--border); color: var(--muted); }
  .status-pill.cancelled { background: rgba(255,107,107,0.18); color: var(--error); }
  .format-toggle {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }
  .format-btn {
    flex: 1;
    padding: 9px;
    background: #0f1115;
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--muted);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  .format-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: white;
  }
  .field-hint {
    font-size: 11px;
    color: var(--muted);
    margin: -4px 0 16px;
  }
  .order-rows {
    margin-bottom: 16px;
  }
  .order-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 8px;
  }
  .order-row .pick-label {
    font-size: 12px;
    color: var(--muted);
    width: 52px;
    flex-shrink: 0;
  }
  .order-row select { margin-bottom: 0; }
  .players { margin-bottom: 8px; }
  .player-list {
    list-style: none;
    margin: 0;
    padding: 0;
  }
  .player-list li {
    font-size: 13px;
    color: var(--text);
    padding: 6px 0;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
  }
  .player-list li:last-child { border-bottom: none; }
  .player-list .pos {
    color: var(--muted);
    font-size: 11px;
  }
  .player-filters {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }
  .position-pills {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .position-pill {
    width: auto;
    padding: 6px 12px;
    font-size: 12px;
    font-weight: 600;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 999px;
  }
  .position-pill:hover { background: var(--border); }
  .position-pill.active {
    background: var(--accent);
    border-color: var(--accent);
    color: white;
  }
  .sort-hint {
    font-size: 11px;
    color: var(--muted);
  }
  .ratings-table-wrap {
    overflow-x: auto;
    border: 1px solid var(--border);
    border-radius: 8px;
    max-height: 480px;
    overflow-y: auto;
  }
  /* In the draft room, the outer .dr-content is already the scroll
     container — let the table grow to its natural height and fill the
     available space instead of capping it and leaving empty background
     below (which was the real "black box"). */
  #drPlayersSection .ratings-table-wrap {
    max-height: none;
    overflow-y: visible;
  }
  .ratings-table {
    border-collapse: collapse;
    width: 100%;
    font-size: 12px;
    white-space: nowrap;
  }
  .ratings-table th, .ratings-table td {
    padding: 7px 9px;
    text-align: right;
    border-bottom: 1px solid var(--border);
  }
  .ratings-table th:first-child, .ratings-table td:first-child {
    text-align: left;
    position: sticky;
    left: 0;
    background: var(--card);
  }
  .ratings-table th {
    position: sticky;
    top: 0;
    background: var(--card);
    color: var(--muted);
    font-weight: 700;
    cursor: pointer;
    user-select: none;
    z-index: 1;
  }
  .ratings-table th:first-child { z-index: 2; }
  .ratings-table th:hover { color: var(--text); }
  .ratings-table th.sort-active { color: var(--accent); }
  .ratings-table td.sort-active { color: var(--text); font-weight: 700; background: rgba(79,140,255,0.06); }
  .dr-board-table th, .dr-board-table td { text-align: left; min-width: 92px; }
  .dr-board-table th:first-child, .dr-board-table td:first-child { min-width: 28px; text-align: center; }
  .dr-board-table td.dr-board-col-alt { background: rgba(255,255,255,0.08); }
  .dr-board-table th.dr-board-col-alt { background: rgba(255,255,255,0.12); }
  .dr-board-table td.dr-board-current,
  .dr-board-table th.dr-board-current { background: rgba(79,140,255,0.14); }
  .dr-board-price { display: block; color: var(--muted); font-size: 11px; }
  .ratings-table tbody tr:hover td { background: rgba(255,255,255,0.03); }
  .ratings-table tbody tr:hover td:first-child { background: var(--card); }
  .ratings-name-cell { font-weight: 600; }
  .queue-star-btn {
    width: auto;
    padding: 0;
    margin: 0 6px 0 0;
    background: none;
    border: none;
    border-radius: 0;
    font-size: 16px;
    line-height: 1;
    color: var(--muted);
    cursor: pointer;
    vertical-align: middle;
  }
  .queue-star-btn:hover { background: none; color: var(--star); }
  .queue-star-btn.queued { color: var(--star); }
  .ratings-table .draft-player-btn,
  .ratings-table .nominate-player-btn {
    width: auto;
    padding: 5px 12px;
    font-size: 11px;
  }
  .draft-card .start-draft-btn {
    margin-top: 10px;
  }
  .on-clock {
    margin-top: 10px;
    padding: 10px 12px;
    border-radius: 8px;
    background: var(--border);
    font-size: 13px;
  }
  .on-clock.mine {
    background: rgba(79,140,255,0.18);
    border: 1px solid var(--accent);
  }
  .on-clock.complete {
    background: rgba(79,219,138,0.15);
    color: var(--success);
    font-weight: 600;
    text-align: center;
  }
  .available-players {
    margin-top: 10px;
    max-height: 240px;
    overflow-y: auto;
    border: 1px solid var(--border);
    border-radius: 8px;
  }
  .available-player-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 10px;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
  }
  .available-player-row:last-child { border-bottom: none; }
  .available-player-row .pos {
    color: var(--muted);
    font-size: 11px;
  }
  .available-player-row button {
    width: auto;
    padding: 6px 14px;
    font-size: 12px;
  }
  .pick-history {
    margin-top: 12px;
  }
  .pick-history-title {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--muted);
    margin-bottom: 6px;
  }
  /* Grid (not flex) so columns actually line up between the header row and
     every data row — with flex, each row sized its 2nd/3rd columns to its
     own content independently, so "Team" drifted out of alignment with the
     team names whenever a player name was a different length. */
  .pick-history-row, .pick-history-header {
    display: grid;
    grid-template-columns: 32px 1.3fr 1fr;
    gap: 10px;
  }
  .pick-history-row {
    font-size: 12px;
    color: var(--muted);
    padding: 4px 0;
    border-bottom: 1px solid var(--border);
  }
  .pick-history-row span:first-child { color: var(--text); }
  .pick-history-row:last-child { border-bottom: none; }
  .pick-history-row .pick-history-team { color: var(--text); }
  .pick-history-header {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--text);
    padding: 0 0 6px;
  }
  .pick-team-logo {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    object-fit: cover;
    flex-shrink: 0;
    vertical-align: middle;
    margin-right: 4px;
  }
  .pick-team-logo-fallback {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: var(--card);
    color: var(--muted);
    font-size: 9px;
    font-weight: 700;
  }
  .dr-roster-progress { display: flex; align-items: center; gap: 6px; }
  .bid-row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: 10px;
  }
  .bid-row select, .bid-row .custom-select {
    flex: 1;
    min-width: 140px;
    margin-bottom: 0;
  }
  .bid-row input {
    width: 90px;
    margin-bottom: 0;
  }
  .bid-row button {
    width: auto;
    flex-shrink: 0;
    padding: 10px 16px;
  }
  .bid-stepper {
    display: flex;
    align-items: center;
    gap: 0;
    border: 1px solid var(--border);
    border-radius: 999px;
    overflow: hidden;
    background: #0f1115;
  }
  .bid-step-btn {
    width: 34px;
    flex-shrink: 0;
    padding: 8px 0;
    border-radius: 0;
    background: transparent;
    font-size: 16px;
    font-weight: 700;
  }
  .bid-step-btn:hover { background: var(--border); }
  .bid-stepper input {
    width: 60px;
    text-align: center;
    border: none;
    background: transparent;
    margin-bottom: 0;
    padding: 8px 0;
    -moz-appearance: textfield;
  }
  .bid-stepper input::-webkit-outer-spin-button,
  .bid-stepper input::-webkit-inner-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }
  .sell-nomination-btn {
    margin-top: 8px;
    background: var(--success);
  }
  .pick-timer {
    display: inline-block;
    margin-left: 8px;
    font-weight: 700;
    font-size: 12px;
    color: var(--muted);
  }
  .pick-timer.overdue { color: var(--error); }
  .timer-adjust {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    margin-left: 8px;
  }
  .timer-seconds-input {
    width: 56px;
    margin-bottom: 0;
    padding: 4px 6px;
    font-size: 12px;
  }
  .timer-seconds-save-btn {
    width: auto;
    padding: 4px 10px;
    font-size: 12px;
  }
  .draft-card .toggle-details-btn,
  .draft-card .start-draft-btn,
  .draft-card .cancel-draft-btn,
  .draft-card .delete-draft-btn {
    width: auto;
    margin-top: 10px;
    margin-right: 8px;
    padding: 8px 14px;
    font-size: 12px;
  }
  .draft-card .cancel-draft-btn,
  .draft-card .delete-draft-btn {
    color: var(--error);
    border-color: rgba(255,107,107,0.4);
  }
  .draft-card .cancel-draft-btn:hover,
  .draft-card .delete-draft-btn:hover {
    background: rgba(255,107,107,0.1);
  }
  .draft-card .enter-draft-room-btn {
    margin-top: 10px;
  }

  /* Draft Room: full-screen takeover while a draft is active */
  .draft-room {
    position: fixed;
    inset: 0;
    background: var(--bg);
    color: var(--text);
    z-index: 100;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .dr-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .dr-icon-btn {
    width: 36px;
    height: 36px;
    flex-shrink: 0;
    padding: 0;
    border-radius: 50%;
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    font-size: 15px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .dr-icon-btn:hover { background: var(--border); }
  #drSettingsBtn { font-size: 26px; }
  .dr-status {
    flex: 1;
    text-align: center;
    font-size: 13px;
    font-weight: 600;
    min-width: 0;
  }
  .dr-round-pick {
    color: var(--muted);
    font-weight: 400;
    display: block;
    font-size: 11px;
    margin-bottom: 2px;
  }
  .dr-settings-panel {
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 10px;
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    font-size: 13px;
  }
  .dr-settings-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .dr-settings-panel label { margin: 0; }
  .dr-undo-btn {
    background: var(--warning);
    border-color: var(--warning);
    color: #1a1208;
    font-weight: 600;
  }
  .dr-undo-btn:hover { background: var(--warning-hover); border-color: var(--warning-hover); }
  .dr-settings-panel input {
    width: 70px;
    margin-bottom: 0;
  }
  .dr-settings-panel button {
    width: auto;
    padding: 8px 14px;
    font-size: 12px;
  }
  .dr-team-strip {
    display: flex;

  const POSITION_BUCKET_MAP = {

  function teamLogoHtml(name, logoUrl) {
    if (logoUrl) return '<img class="pick-team-logo" src="' + escapeHtml(logoUrl) + '" alt="">';
    return '<span class="pick-team-logo pick-team-logo-fallback">' + (name ? escapeHtml(name.charAt(0)) : "?") + "</span>";
  }

  // Markup for a themed dropdown standing in for a native <select> (see the
  // .custom-select CSS comment for why). `customSelectInnerHtml` is the
  // toggle+menu only, for when an existing stable container element plays
  // the role of the wrapper; `renderCustomSelect` wraps that in a fresh
  // div with its own id, for cases regenerated wholesale on every render.
  function customSelectOptionsHtml(options, selectedValue) {
    return options.map((o) =>
      '<button type="button" class="custom-select-option' + (o.value === selectedValue ? " selected" : "") +
      '" data-value="' + escapeHtml(o.value) + '">' + escapeHtml(o.label) + "</button>"
    ).join("");
  }

  function customSelectInnerHtml(options, selectedValue) {
    const selected = options.find((o) => o.value === selectedValue) || options[0] || { label: "" };
    return '<button type="button" class="custom-select-toggle">' +
        '<span class="custom-select-label">' + escapeHtml(selected.label || "") + "</span>" +
        '<svg class="custom-select-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>' +
      "</button>" +
      '<div class="custom-select-menu">' + customSelectOptionsHtml(options, selectedValue) + "</div>";
  }

  function renderCustomSelect(id, options, selectedValue) {
    const selected = options.find((o) => o.value === selectedValue) || options[0];
    return '<div class="custom-select" id="' + id + '" data-value="' + escapeHtml(selected ? selected.value : "") + '">' +

    "</div>";
  }

    return list.slice().sort((a, b) => {
      const av = a[field];
      const bv = b[field];
      if (av == null && bv == null) return 0;
      if (av == null) return 1;
      if (bv == null) return -1;
      return dir === "desc" ? bv - av : av - bv;

        '<div class="order-row">' +
          '<span class="pick-label">Pick ' + pos + "</span>" +
          '<select id="orderPos' + pos + '">' + options + "</select>" +
        "</div>"
      );
    }).join("");
    // Default each position to a different entry so the selects start as a valid permutation.
    entries.forEach((e, i) => {
      document.getElementById("orderPos" + (i + 1)).value = e.id;
    });
  }

  function statusLabel(status) {
    return status.replace("_", " ");
  }

  // The stored format value stays "auction" (drafts.format check constraint,
  // all the d.format === "auction" logic) since it's an internal identifier —
  // only the displayed label changes to "Salary Cap" per the user's request.
  function formatLabel(format) {
    return format === "auction" ? "Salary Cap" : "Snake";
  }

  // Whose turn is it for a given overall pick number, given the draft's team
  // order? Computed here rather than stored, so it can never drift out of
  // sync with the actual picks made.
  function computeTurn(order, teamCount, pickNumber) {
    const round = Math.ceil(pickNumber / teamCount);
    const posInRound = pickNumber - (round - 1) * teamCount;
    const position = (round % 2 === 1) ? posInRound : (teamCount + 1 - posInRound);
    const slot = order.find((o) => o.pick_position === position);
    return { round: round, slot: slot };
  }

  function formatDuration(totalSeconds) {
    const sign = totalSeconds < 0 ? "-" : "";
    const abs = Math.abs(Math.round(totalSeconds));
    const m = Math.floor(abs / 60);
    const s = abs % 60;
    return sign + m + ":" + String(s).padStart(2, "0");
  }

  function updatePickTimers() {
    document.querySelectorAll(".pick-timer").forEach((el) => {
      const deadline = new Date(el.dataset.deadline).getTime();
      const remaining = (deadline - Date.now()) / 1000;
      if (remaining >= 0) {
        el.textContent = formatDuration(remaining) + " left";
        el.classList.remove("overdue");
      } else {
        el.textContent = "Overdue by " + formatDuration(remaining).replace("-", "");
        el.classList.add("overdue");
      }
    });
  }

  // Records a win: closes the nomination (only if still open — the .eq
  // guards against two clients racing to do this at the same moment) then
  // inserts the pick with team_id left null for the winning GM to assign.
  async function awardNomination(d, openNom) {
    const rotationSize = d.draft_order.length;
    const round = Math.ceil(openNom.nomination_number / rotationSize);

    const { data, error: nomError } = await sb
      .from("nominations")
      .update({ status: "sold", resolved_at: new Date().toISOString() })
      .eq("id", openNom.id)
      .eq("status", "open")
      .select();

    if (nomError || !data || data.length === 0) return;

    await sb.from("picks").insert({
      draft_id: d.id,
      pick_number: openNom.nomination_number,
      round: round,
      gm_id: openNom.current_bid_gm_id,
      player_id: openNom.player_id,
      amount_paid: openNom.current_bid,
    });

    loadDrafts();
    if (currentDraftRoomId) loadDraftRoom();
  }

  // Reverses the single most recent pick. For salary cap, also reopens the
  // nomination it closed out (preserving the existing bid state) rather than
  // deleting it, so bidding can simply resume — that covers both "wrong
  // winner" and "the auto-award timer shouldn't have fired" cases. The
  // GM's budget and any team assignment fall out automatically once the
  // picks row is gone, since both are computed from picks, not stored.
  async function undoLastPick(d, pickId) {
    const { error: deleteError } = await sb.from("picks").delete().eq("id", pickId);
    if (deleteError) {
      alert("Could not undo pick: " + deleteError.message);
      return;
    }

    if (d.format === "auction") {
      const pick = (d.picks || []).find((p) => p.id === pickId);
      if (pick) {
        await sb.from("nominations")
          .update({ status: "open", resolved_at: null, last_bid_at: new Date().toISOString() })
          .eq("draft_id", d.id)
          .eq("nomination_number", pick.pick_number)
          .eq("status", "sold");
      }
    }

    loadDrafts();
    if (currentDraftRoomId) loadDraftRoom();
  }

  let autoAwardInFlight = new Set();

  // Only the commissioner's or the winning GM's own browser can actually
  // complete an award (the picks insert needs one of those two to pass
  // RLS) — so this only fires from those clients, avoiding a nomination
  // getting closed with no pick ever recorded.
  function checkAutoAward() {
    const d = currentDraftRoomData;
    if (!d || d.format !== "auction" || d.status !== "in_progress" || !currentUser) return;
    const openNom = (d.nominations || []).find((n) => n.status === "open");
    if (!openNom || !openNom.current_bid_gm_id) return;
    if (!isCommissioner && currentUser.id !== openNom.current_bid_gm_id) return;
    if (autoAwardInFlight.has(openNom.id)) return;

    // Bidding deadline is based on the last bid, not the nomination itself —
    // it resets every time someone bids.
    const deadline = new Date(openNom.last_bid_at).getTime() + (d.pick_time_seconds || 90) * 1000;
    if (Date.now() < deadline) return;

    autoAwardInFlight.add(openNom.id);
    awardNomination(d, openNom).finally(() => autoAwardInFlight.delete(openNom.id));
  }

  setInterval(() => {
    updatePickTimers();
    checkAutoAward();
  }, 1000);

  async function loadDrafts() {
    draftsSection.innerHTML = '<div class="league-loading">Loading drafts…</div>';
    const { data, error } = await sb
      .from("drafts")
      .select(
        "id, label, format, status, rounds, starting_budget, created_at, started_at, pick_time_seconds, " +
        "draft_order(pick_position, team_id, gm_id, teams(name, gms(name)), gms(name))"
      )
      .order("created_at", { ascending: false });

    if (error) {
      draftsSection.innerHTML = '<div class="league-error">Could not load drafts: ' + escapeHtml(error.message) + '</div>';
      return;
    }

    if (data.length === 0) {
      draftsSection.innerHTML = '<div class="league-loading">No drafts created yet.</div>';
      return;
    }

    draftsSection.innerHTML = data.map((d) => {
      const configText = d.format === "snake"
        ? (d.rounds ? d.rounds + " rounds" : "rounds not set")
        : (d.starting_budget ? "$" + d.starting_budget + " budget" : "budget not set");

      const order = (d.draft_order || []).slice().sort((a, b) => a.pick_position - b.pick_position);
      d.draft_order = order;

      const cancelBtnHtml = (isCommissioner && (d.status === "setup" || d.status === "in_progress"))
        ? '<button class="cancel-draft-btn secondary" data-draft-id="' + d.id + '">Cancel Draft</button>'
        : "";
      const deleteBtnHtml = (isCommissioner && d.status !== "in_progress")
        ? '<button class="delete-draft-btn secondary" data-draft-id="' + d.id + '">Delete Draft</button>'
        : "";

      let bodyHtml;
      if (d.status === "in_progress") {
        bodyHtml = '<button type="button" class="enter-draft-room-btn" data-draft-id="' + d.id + '">Enter Draft Room</button>' + cancelBtnHtml;
      } else {
        // Setup/completed/cancelled drafts collapse to a summary by default —
        // showing their full pick order for every old test draft was making
        // the Drafts tab unwieldy to scroll through.
        const isExpanded = expandedDraftIds.has(d.id);
        const pickOrderHtml = order.length === 0 || !isExpanded
          ? ""
          : '<ol class="pick-order-list">' +
              order.map((o) => {
                if (o.gm_id) {
                  return "<li>" + escapeHtml(o.gms ? o.gms.name : "Unknown GM") + "</li>";
                }
                const teamName = o.teams ? o.teams.name : "Unknown team";
                const teamGmName = o.teams && o.teams.gms ? o.teams.gms.name : "";
                return "<li>" + escapeHtml(teamName) + (teamGmName ? " (" + escapeHtml(teamGmName) + ")" : "") + "</li>";
              }).join("") +
            "</ol>";
        const toggleBtnHtml = order.length === 0
          ? ""
          : '<button type="button" class="toggle-details-btn secondary" data-draft-id="' + d.id + '">' +
              (isExpanded ? "Hide pick order" : "Show pick order") +
            "</button>";
        const startBtnHtml = (isCommissioner && d.status === "setup")
          ? '<button class="start-draft-btn" data-draft-id="' + d.id + '">Start Draft</button>'
          : "";
        bodyHtml = toggleBtnHtml + pickOrderHtml + startBtnHtml + cancelBtnHtml + deleteBtnHtml;
      }

      return (
        '<div class="draft-card">' +
          '<div class="draft-label">' + escapeHtml(d.label || "Untitled Draft") + "</div>" +
          '<div class="draft-meta">' +
            '<span class="status-pill ' + d.status + '">' + escapeHtml(statusLabel(d.status)) + "</span>" +
            "<span>" + escapeHtml(formatLabel(d.format)) + "</span>" +
            "<span>" + escapeHtml(configText) + "</span>" +
          "</div>" +
          bodyHtml +
        "</div>"
      );
    }).join("");
  }

  // ---------- Draft Room (full-screen live draft experience) ----------

  const DRAFT_ROOM_SELECT =
    "id, label, format, status, rounds, starting_budget, created_at, started_at, pick_time_seconds, " +
    "draft_order(pick_position, team_id, gm_id, teams(id, name, logo_url, gms(name))), " +
    "picks(id, pick_number, round, team_id, gm_id, player_id, amount_paid, picked_at, teams(name, logo_url), gms(name), players(name, position)), " +
    "nominations(id, nomination_number, player_id, status, current_bid, current_bid_team_id, current_bid_gm_id, created_at, resolved_at, last_bid_at, " +
      "players(name, position, ovr), " +
      "bidder:teams!current_bid_team_id(name, gms(name)), " +
      "bidderGm:gms!current_bid_gm_id(name))";

  function initials(name) {
    return name.split(" ").filter(Boolean).map((w) => w.charAt(0).toUpperCase()).slice(0, 2).join("");
  }

  // Total picks needed to fill the league always uses the real team count
  // (8), never d.draft_order.length — that's the rotation size, which for
  // salary cap drafts is 4 GMs, not 8 teams.
  function draftTotalPicksTarget(d) {
    return d.rounds ? d.rounds * allTeams.length : null;
  }

  function computeGmBudgets(d) {
    const budgets = {};
    allGms.forEach((g) => {
      budgets[g.id] = d.starting_budget || 0;
    });
    (d.picks || []).forEach((p) => {
      if (p.gm_id && budgets[p.gm_id] !== undefined && p.amount_paid) {
        budgets[p.gm_id] -= p.amount_paid;
      }
    });
    return budgets;
  }

  // How much a GM could offer on the current nomination without leaving
  // themselves unable to afford $1 minimum bids on their remaining slots
  // across both their teams.
  function computeMaxOffer(d, gmId) {
    const budgets = computeGmBudgets(d);
    const budget = budgets[gmId] != null ? budgets[gmId] : (d.starting_budget || 0);
    const myTeamsCount = allTeams.filter((t) => t.gmId === gmId).length;
    const target = d.rounds ? d.rounds * myTeamsCount : null;
    if (!target) return budget;
    const won = (d.picks || []).filter((p) => p.gm_id === gmId).length;
    const remainingSlots = Math.max(0, target - won);
    const reserve = Math.max(0, remainingSlots - 1);
    return Math.max(0, budget - reserve);
  }

  // How many nominations until it's this viewer's turn to nominate (0 means
  // it's their turn right now). Null if they're not a participant (e.g. the
  // commissioner isn't necessarily in the rotation... though here she is).
  function nominationsUntilMyTurn(d) {
    const rotationSize = d.draft_order.length;
    const myPosition = d.draft_order.find((o) => o.gm_id === currentUser.id);
    if (!myPosition) return null;
    const nextNominationNumber = (d.nominations || []).length + 1;
    const currentPositionInRotation = ((nextNominationNumber - 1) % rotationSize) + 1;
    let diff = myPosition.pick_position - currentPositionInRotation;
    if (diff < 0) diff += rotationSize;
    return diff;
  }

  // Returns { teamId } for snake drafts or { gmId } for salary cap drafts —
  // whoever is up next to pick/nominate — or null if the draft is complete
  // or (salary cap only) a nomination is currently open for bidding.
  function getCurrentTurn(d) {
    const rotationSize = d.draft_order.length;
    if (d.format === "snake") {
      const picks = (d.picks || []).slice().sort((a, b) => a.pick_number - b.pick_number);
      const totalPicks = draftTotalPicksTarget(d);
      const nextPickNumber = picks.length + 1;
      if (totalPicks && nextPickNumber > totalPicks) return null;
      const turn = computeTurn(d.draft_order, rotationSize, nextPickNumber);
      return turn.slot ? { teamId: turn.slot.team_id } : null;
    }
    const auctionTotal = draftTotalPicksTarget(d);
    if (auctionTotal && (d.picks || []).length >= auctionTotal) return null;
    const openNom = (d.nominations || []).find((n) => n.status === "open");
    if (openNom) return null;
    const nextNominationNumber = (d.nominations || []).length + 1;
    const position = ((nextNominationNumber - 1) % rotationSize) + 1;
    const slot = d.draft_order.find((o) => o.pick_position === position);
    return slot ? { gmId: slot.gm_id } : null;
  }

  function renderTimerDisplay(baseTimeIso, pickTimeSeconds) {
    if (!baseTimeIso) return "";
    const deadlineIso = new Date(new Date(baseTimeIso).getTime() + (pickTimeSeconds || 90) * 1000).toISOString();
    return ' <span class="pick-timer" data-deadline="' + deadlineIso + '"></span>';
  }

  function renderDrTeamStrip(d) {
    const turn = getCurrentTurn(d);

    if (d.format === "auction") {
      // Salary cap: one chip per GM (not team), since bidding is per-GM.
      const budgets = computeGmBudgets(d);
      drTeamStrip.innerHTML = d.draft_order.map((o) => {
        const gm = allGms.find((g) => g.id === o.gm_id);
        const isCurrent = !!turn && turn.gmId === o.gm_id;
        const bal = budgets[o.gm_id] != null ? budgets[o.gm_id] : d.starting_budget;
        return '<div class="dr-team-chip' + (isCurrent ? " current" : "") + '">' +
          '<div class="dr-team-chip-fallback">' + (gm ? escapeHtml(gm.name.charAt(0)) : "?") + "</div>" +
          '<span class="dr-team-name">' + escapeHtml(gm ? gm.name : "Unknown") + "</span>" +
          '<span class="dr-team-budget">$' + bal + "</span></div>";
      }).join("");
      return;
    }

    drTeamStrip.innerHTML = d.draft_order.map((o) => {
      const team = o.teams;
      const isCurrent = !!turn && turn.teamId === o.team_id;
      const logo = team && team.logo_url
        ? '<img src="' + escapeHtml(team.logo_url) + '" alt="">'
        : '<div class="dr-team-chip-fallback">' + (team ? escapeHtml(team.name.charAt(0)) : "?") + "</div>";
      return '<div class="dr-team-chip' + (isCurrent ? " current" : "") + '">' + logo +
        '<span class="dr-team-name">' + escapeHtml(team ? team.name : "Unknown") + "</span></div>";
    }).join("");
  }

  function renderDrStatusAndBanner(d) {
    const teamCount = d.draft_order.length;
    const picks = (d.picks || []).slice().sort((a, b) => a.pick_number - b.pick_number);
    const totalPicks = d.rounds ? d.rounds * teamCount : null;

    drBanner.innerHTML = "";

    if (d.status !== "in_progress") {
      drStatus.textContent = statusLabel(d.status);
      return;
    }

    if (d.format === "snake") {
      const nextPickNumber = picks.length + 1;
      if (totalPicks && nextPickNumber > totalPicks) {
        drStatus.innerHTML = "🎉 Draft complete!";
        return;
      }
      const turn = computeTurn(d.draft_order, teamCount, nextPickNumber);
      const teamName = turn.slot && turn.slot.teams ? turn.slot.teams.name : "Unknown team";
      const lastPick = picks.length > 0 ? picks[picks.length - 1] : null;
      const baseTime = lastPick ? lastPick.picked_at : d.started_at;
      drStatus.innerHTML = '<span class="dr-round-pick">Round ' + turn.round + " · Pick " + nextPickNumber + "</span>" +
        escapeHtml(teamName) + renderTimerDisplay(baseTime, d.pick_time_seconds);
      return;
    }

    // Salary cap (auction): GM-based nomination and bidding, not team-based.
    const auctionTotal = draftTotalPicksTarget(d);
    if (auctionTotal && picks.length >= auctionTotal) {
      drStatus.innerHTML = "🎉 Draft complete!";
      return;
    }
    const rotationSize = d.draft_order.length;
    const untilMyTurn = nominationsUntilMyTurn(d);
    const turnLine = untilMyTurn === 0
      ? '<span class="you-badge">Your turn to nominate</span>'
      : (untilMyTurn != null ? escapeHtml(untilMyTurn + (untilMyTurn === 1 ? " nomination" : " nominations") + " until your turn") : "");

    const openNom = (d.nominations || []).find((n) => n.status === "open");
    if (openNom) {
      const playerName = openNom.players ? openNom.players.name : "Unknown player";
      const playerPos = openNom.players && openNom.players.position ? openNom.players.position : "";
      const playerOvr = openNom.players && openNom.players.ovr != null ? openNom.players.ovr : null;
      const bidGmName = openNom.bidderGm ? openNom.bidderGm.name : "Nobody yet";

      // Bidding has its own timer, separate from the nomination timer —
      // it resets to a fresh countdown every time someone bids.
      drStatus.innerHTML = renderTimerDisplay(openNom.last_bid_at, d.pick_time_seconds) +
        '<span class="dr-round-pick" style="margin-top:4px;">' + turnLine + "</span>";

      const budgets = computeGmBudgets(d);
      const nextBid = openNom.current_bid + 1;
      let controlsHtml = "";
      const iAmEligible = currentUser.id !== openNom.current_bid_gm_id;

      const bal = budgets[currentUser.id] != null ? budgets[currentUser.id] : "?";
      const maxOffer = computeMaxOffer(d, currentUser.id);

      if (iAmEligible) {
        controlsHtml =
          '<div class="dr-bid-bottom">' +
            '<div class="bid-stepper">' +
              '<button type="button" class="bid-step-btn" data-step="-1">−</button>' +
              '<input id="bidAmountInput" type="number" min="' + nextBid + '" step="1" value="' + nextBid + '">' +
              '<button type="button" class="bid-step-btn" data-step="1">+</button>' +
            "</div>" +
            '<button class="place-bid-btn" data-draft-id="' + d.id +
              '" data-nomination-id="' + openNom.id +
              '" data-current-bid="' + openNom.current_bid +
              '" data-current-bid-gm-id="' + (openNom.current_bid_gm_id || "") + '">Offer $' + nextBid + "</button>" +
          "</div>" +
          '<div class="dr-bid-hint">Max Offer $' + maxOffer + " · Budget $" + bal + "</div>";
      } else {
        controlsHtml =
          '<div class="dr-bid-bottom dr-bid-bottom-disabled">' +
            '<div class="bid-stepper"><button type="button" disabled>−</button><input disabled value="' + nextBid + '"><button type="button" disabled>+</button></div>' +
            '<button class="place-bid-btn" disabled>You have the highest bid</button>' +
          "</div>" +
          '<div class="dr-bid-hint">Max Offer $' + maxOffer + " · Budget $" + bal + "</div>";
      }

      drBanner.innerHTML = '<div class="dr-bid-banner">' +
        '<div class="dr-bid-top">' +
          '<div class="dr-bid-player">' + escapeHtml(playerName) +
            (playerPos ? ' <span class="pos">' + escapeHtml(playerPos) + (playerOvr != null ? '<span class="dr-bid-ovr">OVR ' + playerOvr + "</span>" : "") + "</span>" : "") +
          "</div>" +
          '<div class="dr-bid-current">' +
            '<div class="dr-bid-current-amount">$' + openNom.current_bid + "</div>" +
            '<div class="dr-bid-current-team">' + escapeHtml(bidGmName) + "</div>" +
          "</div>" +
        "</div>" +
        controlsHtml +
      "</div>";
    } else {
      const nextNominationNumber = (d.nominations || []).length + 1;
      const position = ((nextNominationNumber - 1) % rotationSize) + 1;
      const slot = d.draft_order.find((o) => o.pick_position === position);
      const gm = slot ? allGms.find((g) => g.id === slot.gm_id) : null;
      const soldNoms = (d.nominations || []).filter((n) => n.status === "sold")
        .sort((a, b) => new Date(a.resolved_at) - new Date(b.resolved_at));
      const lastSoldNom = soldNoms.length > 0 ? soldNoms[soldNoms.length - 1] : null;
      const baseTime = lastSoldNom ? lastSoldNom.resolved_at : d.started_at;
      drStatus.innerHTML = renderTimerDisplay(baseTime, d.pick_time_seconds) +
        '<span class="dr-round-pick" style="margin-top:4px;">' +
        (untilMyTurn === 0 ? '<span class="you-badge">Your turn to nominate</span>' : "Nominate — " + escapeHtml(gm ? gm.name : "Unknown")) +
        "</span>";
    }
  }

  function buildDrPositionPills() {
    drPositionPills.innerHTML = POSITION_FILTERS.map((pos) =>
      '<button type="button" class="position-pill' + (pos === playerPositionFilter ? " active" : "") + '" data-position="' + escapeHtml(pos) + '">' + escapeHtml(pos) + "</button>"
    ).join("");
  }

  function renderDrPlayers(d) {
    const teamCount = d.draft_order.length;
    const picks = d.picks || [];
    const pickedIds = new Set(picks.map((p) => p.player_id));
    let pool = allPlayers.filter((p) => !pickedIds.has(p.id) && playerMatchesPositionFilter(p, playerPositionFilter));
    pool = sortPlayers(pool, playerSortField, playerSortDir);

    let actionType = null;
    let actionTeamId = null;
    let actionGmId = null;
    let actionExtra = {};

    if (d.status === "in_progress") {
      const turn = getCurrentTurn(d);
      if (turn && d.format === "snake") {
        if (isCommissioner || myTeamIds.indexOf(turn.teamId) !== -1) {
          const nextPickNumber = picks.length + 1;
          const computed = computeTurn(d.draft_order, teamCount, nextPickNumber);
          actionType = "draft";
          actionTeamId = turn.teamId;
          actionExtra = { pickNumber: nextPickNumber, round: computed.round };
        }
      } else if (turn && d.format === "auction") {
        if (isCommissioner || turn.gmId === currentUser.id) {
          actionType = "nominate";
          actionGmId = turn.gmId;
          actionExtra = { nominationNumber: (d.nominations || []).length + 1 };
        }
      }
    }

    if (pool.length === 0) {
      drPlayersSection.innerHTML = '<div class="league-loading">No players left in the pool.</div>';
      return;
    }

    // Action column sits right after Name (not at the far end) so it's
    // visible without scrolling through all 16 rating columns first.
    const headerCells = "<th>Name</th>" + (actionType ? "<th></th>" : "") + "<th>Pos</th>" + RATING_FIELDS.map(ratingHeaderCell).join("");
    const bodyRows = pool.map((p) => {
      const cells = RATING_FIELDS.map((f) => {
        const v = p[f.key];
        return '<td class="' + (f.key === playerSortField ? "sort-active" : "") + '">' + (v != null ? v : "—") + "</td>";
      }).join("");
      let actionCell = "";
      if (actionType === "draft") {
        actionCell = '<td><button class="draft-player-btn" data-draft-id="' + d.id +
          '" data-team-id="' + actionTeamId +
          '" data-pick-number="' + actionExtra.pickNumber +
          '" data-round="' + actionExtra.round +
          '" data-player-id="' + p.id + '">Draft</button></td>';
      } else if (actionType === "nominate") {
        actionCell = '<td><button class="nominate-player-btn" data-draft-id="' + d.id +
          '" data-gm-id="' + actionGmId +
          '" data-nomination-number="' + actionExtra.nominationNumber +
          '" data-player-id="' + p.id + '">Nominate</button></td>';
      } else if (actionType) {
        actionCell = "<td></td>";
      }
      const queued = isQueued(p.id);
      const starBtn = '<button type="button" class="queue-star-btn' + (queued ? " queued" : "") +
        '" data-player-id="' + p.id + '" title="' + (queued ? "Remove from queue" : "Add to queue") + '">' +
        (queued ? "★" : "☆") + "</button>";
      return (
        "<tr>" +
          '<td class="ratings-name-cell">' + starBtn + escapeHtml(p.name) + "</td>" +
          actionCell +
          "<td>" + (p.position ? escapeHtml(p.position) : "—") + "</td>" +
          cells +
        "</tr>"
      );
    }).join("");

    drPlayersSection.innerHTML =
      '<div class="ratings-table-wrap">' +
        '<table class="ratings-table"><thead><tr>' + headerCells + "</tr></thead><tbody>" + bodyRows + "</tbody></table>" +
      "</div>";
  }

  // Your private watchlist, filtered to players still available in this
  // draft — a player already picked (by anyone) drops out of view here
  // without removing the underlying queue row, since the same queue is
  // reused across drafts sharing the pool. Same table markup/sort headers
  // as the Players tab, so tapping a column here re-sorts both.
  function renderDrQueue(d) {
    const pickedIds = new Set((d.picks || []).map((p) => p.player_id));
    let queuedPlayers = myQueueEntries
      .map((e) => allPlayers.find((p) => p.id === e.player_id))
      .filter((p) => p && !pickedIds.has(p.id));
    queuedPlayers = sortPlayers(queuedPlayers, playerSortField, playerSortDir);

    if (queuedPlayers.length === 0) {
      drQueueSection.innerHTML = '<div class="league-loading">No players queued yet — tap the star next to a player in the Players tab.</div>';
      return;
    }

    const headerCells = "<th>Name</th><th>Pos</th>" + RATING_FIELDS.map(ratingHeaderCell).join("");
    const bodyRows = queuedPlayers.map((p) => {
      const cells = RATING_FIELDS.map((f) => {
        const v = p[f.key];
        return '<td class="' + (f.key === playerSortField ? "sort-active" : "") + '">' + (v != null ? v : "—") + "</td>";
      }).join("");
      const starBtn = '<button type="button" class="queue-star-btn queued" data-player-id="' + p.id + '" title="Remove from queue">★</button>';
      return (
        "<tr>" +
          '<td class="ratings-name-cell">' + starBtn + escapeHtml(p.name) + "</td>" +
          "<td>" + (p.position ? escapeHtml(p.position) : "—") + "</td>" +
          cells +
        "</tr>"
      );
    }).join("");

    drQueueSection.innerHTML =
      '<div class="ratings-table-wrap">' +
        '<table class="ratings-table"><thead><tr>' + headerCells + "</tr></thead><tbody>" + bodyRows + "</tbody></table>" +
      "</div>";
  }

  // Grid view of the whole draft's shape: teams × rounds for snake, GMs ×
  // nomination-rounds for salary cap (auction "round" is one cycle of the
  // 4-GM rotation, not one pick per 8-team roster slot — same `round` value
  // already stored on each pick, just laid out as a grid instead of a list).
  // Column striping (alternating shade every other column) plus the
  // current-turn highlight, combined into one class string — kept as a
  // shared helper since both formats' grids need the same two flags.
  function boardCellClass(colIndex, isCurrent) {
    let cls = colIndex % 2 === 1 ? "dr-board-col-alt" : "";
    if (isCurrent) cls = (cls + " dr-board-current").trim();
    return cls;
  }

  function renderDrBoard(d) {
    if (!d.rounds) {
      drBoardSection.innerHTML = '<div class="league-loading">Set a number of rounds to see the board.</div>';
      return;
    }
    const picks = d.picks || [];
    const turn = getCurrentTurn(d);
    const cols = d.draft_order;

    if (d.format === "snake") {
      const nextPickNumber = picks.length + 1;
      const currentTurn = turn ? computeTurn(cols, cols.length, nextPickNumber) : null;

      const headerCells = cols.map((o, i) =>
        '<th class="' + boardCellClass(i, false) + '">' + escapeHtml(o.teams ? o.teams.name : "?") + "</th>"
      ).join("");
      let bodyRows = "";
      for (let r = 1; r <= d.rounds; r++) {
        const cells = cols.map((o, i) => {
          const pick = picks.find((p) => p.team_id === o.team_id && p.round === r);
          const isCurrent = !!currentTurn && turn.teamId === o.team_id && currentTurn.round === r;
          const playerName = pick && pick.players ? pick.players.name : "";
          const playerPos = pick && pick.players && pick.players.position ? pick.players.position : "";
          const label = playerName ? escapeHtml(playerName) + (playerPos ? " (" + escapeHtml(playerPos) + ")" : "") : "";
          return '<td class="' + boardCellClass(i, isCurrent) + '">' + label + "</td>";
        }).join("");
        bodyRows += "<tr><th>" + r + "</th>" + cells + "</tr>";
      }
      drBoardSection.innerHTML = '<div class="ratings-table-wrap"><table class="ratings-table dr-board-table">' +
        "<thead><tr><th></th>" + headerCells + "</tr></thead><tbody>" + bodyRows + "</tbody></table></div>";
      return;
    }

    const rotationSize = cols.length;
    const totalTarget = draftTotalPicksTarget(d);
    const maxRound = totalTarget ? Math.ceil(totalTarget / rotationSize) : 1;
    const currentRound = Math.ceil(((d.nominations || []).length + 1) / rotationSize);

    const headerCells = cols.map((o, i) => {
      const gm = allGms.find((g) => g.id === o.gm_id);
      return '<th class="' + boardCellClass(i, false) + '">' + escapeHtml(gm ? gm.name : "?") + "</th>";
    }).join("");
    let bodyRows = "";
    for (let r = 1; r <= maxRound; r++) {
      const cells = cols.map((o, i) => {
        const pick = picks.find((p) => p.gm_id === o.gm_id && p.round === r);
        const isCurrent = !!turn && turn.gmId === o.gm_id && currentRound === r;
        const cellClass = boardCellClass(i, isCurrent);
        if (!pick) return '<td class="' + cellClass + '"></td>';
        const playerName = pick.players ? pick.players.name : "?";
        const playerPos = pick.players && pick.players.position ? pick.players.position : "";
        return '<td class="' + cellClass + '">' + escapeHtml(playerName) +
          (playerPos ? " (" + escapeHtml(playerPos) + ")" : "") +
          '<span class="dr-board-price">$' + (pick.amount_paid || 0) + "</span></td>";
      }).join("");
      bodyRows += "<tr><th>" + r + "</th>" + cells + "</tr>";
    }
    drBoardSection.innerHTML = '<div class="ratings-table-wrap"><table class="ratings-table dr-board-table">' +
      "<thead><tr><th></th>" + headerCells + "</tr></thead><tbody>" + bodyRows + "</tbody></table></div>";
  }

  function renderDrPicks(d) {
    const picks = (d.picks || []).slice().sort((a, b) => b.pick_number - a.pick_number);
    if (picks.length === 0) {
      drPicksSection.innerHTML = '<div class="league-loading">No picks yet.</div>';
      return;
    }
    drPicksSection.innerHTML = '<div class="pick-history">' +
      '<div class="pick-history-header"><span></span><span>Player</span><span>Team</span></div>' +
      picks.map((p) => {
        const teamName = p.teams ? p.teams.name : (p.gms ? p.gms.name + " (unassigned)" : "");
        const teamLogo = p.teams ? teamLogoHtml(p.teams.name, p.teams.logo_url) : "";
        const playerName = p.players ? p.players.name : "";
        const playerPos = p.players && p.players.position ? p.players.position : "";
        const leadLabel = d.format === "auction" ? "$" + (p.amount_paid || 0) : "#" + p.pick_number;
        return '<div class="pick-history-row"><span>' + escapeHtml(String(leadLabel)) + "</span><span>" +
          escapeHtml(playerName) + (playerPos ? " (" + escapeHtml(playerPos) + ")" : "") +
          '</span><span class="pick-history-team">' + teamLogo + escapeHtml(teamName) + "</span></div>";
      }).join("") +
    "</div>";
  }

  function buildDrRosterTeamSelect() {
    if (drRosterTeamSelect.dataset.built) return;
    drRosterTeamSelect.dataset.built = "1";
    const options = allTeams.map((t) => ({ value: t.id, label: t.name + " (" + t.gmName + ")" }));
    const myFirstTeam = allTeams.find((t) => t.gmId === currentUser.id);

    drRosterTeamSelect.dataset.value = selectedValue;
    drRosterTeamSelect.innerHTML = customSelectInnerHtml(options, selectedValue);

  function renderDrRosterList(d) {
    buildDrRosterTeamSelect();
    const teamId = drRosterTeamSelect.dataset.value;
    const team = allTeams.find((t) => t.id === teamId);
    const teamPicks = (d.picks || [])
      .filter((p) => p.team_id === teamId)
      .sort((a, b) => a.pick_number - b.pick_number);

    const progress = '<div class="dr-roster-progress">' +
      (team ? teamLogoHtml(team.name, team.logoUrl) : "") +
      '<span>' + (team ? escapeHtml(team.name) : "") + " — " + teamPicks.length + (d.rounds ? "/" + d.rounds : "") + "</span>" +
    "</div>";

    if (teamPicks.length === 0) {
      drRosterListSection.innerHTML = progress + '<div class="league-loading">No players drafted to this team yet.</div>';
      return;
    }

    drRosterListSection.innerHTML = progress + '<div class="pick-history">' +
      teamPicks.map((p, i) => {
        const playerName = p.players ? p.players.name : "Unknown";
        const playerPos = p.players && p.players.position ? p.players.position : "";
        const lead = d.format === "auction" ? "$" + (p.amount_paid || 0) : "#" + p.pick_number;
        return '<div class="pick-history-row"><span>' + escapeHtml(String(lead)) + "</span><span>" +
          escapeHtml(playerName) + (playerPos ? " (" + escapeHtml(playerPos) + ")" : "") + "</span></div>";
      }).join("") +
    "</div>";
  }

  function renderDrSettingsPanel(d) {
    if (!isCommissioner) {
      drSettingsPanel.innerHTML = '<span class="sort-hint">Only the commissioner can adjust draft settings.</span>';
      return;
    }
    const timerRow = '<div class="dr-settings-row">' +
      "<label>Seconds per pick</label>" +
      '<input type="number" min="10" step="5" id="drTimerSecondsInput" value="' + d.pick_time_seconds + '">' +
      '<button type="button" id="drTimerSaveBtn">Set</button>' +
    "</div>";

    drSettingsPanel.innerHTML = timerRow + renderDrUndoRow(d);
  }

  // The undo control only ever targets the single most recent pick, never
  // an arbitrary one — pick_number/nomination_number aren't stored sequence
  // counters, they're derived from array position (picks.length + 1), so
  // removing anything but the last pick would desync that math.
  function renderDrUndoRow(d) {
    if (d.status !== "in_progress") return "";
    const picks = (d.picks || []).slice().sort((a, b) => a.pick_number - b.pick_number);
    if (picks.length === 0) return "";
    const lastPick = picks[picks.length - 1];
    const playerName = lastPick.players ? lastPick.players.name : "Unknown player";
    return '<div class="dr-settings-row">' +
      '<button type="button" id="drUndoPickBtn" class="dr-undo-btn" data-pick-id="' + lastPick.id + '">' +
        "Undo Pick #" + lastPick.pick_number + " — " + escapeHtml(playerName) +
      "</button>" +
    "</div>";
  }

  function renderDrPendingAssignment(d) {
    if (d.format !== "auction") {
      drPendingAssignment.innerHTML = "";
      return;
    }
    const myPending = (d.picks || []).filter((p) => p.gm_id === currentUser.id && !p.team_id);
    if (myPending.length === 0) {
      drPendingAssignment.innerHTML = "";
      return;
    }
    const myTeams = allTeams.filter((t) => t.gmId === currentUser.id);
    const teamOptions = myTeams.map((t) => ({ value: t.id, label: t.name }));
    drPendingAssignment.innerHTML = myPending.map((p) => {
      const playerName = p.players ? p.players.name : "Unknown player";
      const selectId = "assignTeamSelect-" + p.id;
      return '<div class="dr-bid-banner dr-assign-banner">' +
        "You won <strong>" + escapeHtml(playerName) + "</strong> for $" + (p.amount_paid || 0) + " — assign to:" +
        '<div class="bid-row">' +
          renderCustomSelect(selectId, teamOptions, teamOptions[0] ? teamOptions[0].value : "") +
          '<button class="assign-pick-team-btn" data-pick-id="' + p.id + '" data-select-id="' + selectId + '">Confirm</button>' +
        "</div>" +
      "</div>";
    }).join("");
  }

  function renderDraftRoom() {
    const d = currentDraftRoomData;
    if (!d) return;
    renderDrTeamStrip(d);
    renderDrStatusAndBanner(d);
    renderDrPendingAssignment(d);
    renderDrPlayers(d);
    renderDrBoard(d);
    renderDrQueue(d);
    renderDrPicks(d);
    renderDrRosterList(d);
    renderDrSettingsPanel(d);
  }

  function refreshPlayerViews() {
    buildDrPositionPills();
    if (currentDraftRoomData) {
      renderDrPlayers(currentDraftRoomData);
      renderDrQueue(currentDraftRoomData);
    }
  }

  async function loadDraftRoom() {
    if (!currentDraftRoomId) return;
    const { data: d, error } = await sb
      .from("drafts")
      .select(DRAFT_ROOM_SELECT)
      .eq("id", currentDraftRoomId)
      .single();

    if (error || !d) {
      drStatus.textContent = "Could not load draft.";
      return;
    }

    d.draft_order = (d.draft_order || []).slice().sort((a, b) => a.pick_position - b.pick_position);
    currentDraftRoomData = d;
    renderDraftRoom();
  }

  function openDraftRoom(draftId) {
    currentDraftRoomId = draftId;
    document.querySelector(".card").style.display = "none";
    draftRoomView.style.display = "flex";
    document.body.style.overflow = "hidden";
    buildDrPositionPills();
    loadDraftRoom();
  }

  function closeDraftRoom() {
    currentDraftRoomId = null;
    currentDraftRoomData = null;
    draftRoomView.style.display = "none";
    document.querySelector(".card").style.display = "block";
    document.body.style.overflow = "";
    loadDrafts();
  }

  drExitBtn.addEventListener("click", closeDraftRoom);

  drSettingsBtn.addEventListener("click", () => {
    drSettingsPanel.style.display = drSettingsPanel.style.display === "none" ? "flex" : "none";
  });

  drSettingsPanel.addEventListener("click", async (e) => {
    if (e.target.id === "drTimerSaveBtn") {
      const input = document.getElementById("drTimerSecondsInput");
      const seconds = parseInt(input.value, 10);
      if (!seconds || seconds < 10) {
        alert("Enter a valid number of seconds (10 or more).");
        return;
      }
      const { error } = await sb.from("drafts").update({ pick_time_seconds: seconds }).eq("id", currentDraftRoomId);
      if (error) alert("Could not update pick timer: " + error.message);
      loadDraftRoom();
      return;
    }

    const undoBtn = e.target.closest("#drUndoPickBtn");
    if (undoBtn) {
      if (!confirm("Undo this pick? The player goes back into the pool. This can't be redone.")) return;
      undoBtn.disabled = true;
      await undoLastPick(currentDraftRoomData, undoBtn.dataset.pickId);
    }
  });

  drTabBtns.forEach((btn) => {
    btn.addEventListener("click", () => {
      drTabBtns.forEach((b) => b.classList.remove("active"));
      drTabPanels.forEach((p) => p.classList.remove("active"));
      btn.classList.add("active");
      document.getElementById("dr-tab-" + btn.dataset.drtab).classList.add("active");
    });
  });

  drSubTabBtns.forEach((btn) => {
    btn.addEventListener("click", () => {
      drSubTabBtns.forEach((b) => b.classList.remove("active"));
      drSubTabPanels.forEach((p) => p.classList.remove("active"));
      btn.classList.add("active");
      document.getElementById("dr-subtab-" + btn.dataset.drsubtab).classList.add("active");
    });

  drRosterTeamSelect.addEventListener("customselect:change", () => {
    if (currentDraftRoomData) renderDrRosterList(currentDraftRoomData);

  drPositionPills.addEventListener("click", (e) => {

  drPlayersSection.addEventListener("click", (e) => {
    const th = e.target.closest("th[data-field]");
    if (!th) return;
    const field = th.dataset.field;
    if (field === playerSortField) {
      playerSortDir = playerSortDir === "desc" ? "asc" : "desc";
    } else {

  drQueueSection.addEventListener("click", (e) => {
    const th = e.target.closest("th[data-field]");
    if (!th) return;
    const field = th.dataset.field;
    if (field === playerSortField) {
      playerSortDir = playerSortDir === "desc" ? "asc" : "desc";
    } else {
      playerSortField = field;
      playerSortDir = "desc";
    }
    refreshPlayerViews();
  });

  let currentUser = null;

  async function renderSignedIn(user) {
    currentUser = user;
    document.querySelector(".card").classList.add("signed-in");
    loginView.style.display = "none";
    appView.style.display = "block";
    gmName.textContent = displayNameFor(user);
    gmEmail.textContent = user.email;
    // League and players must be loaded before drafts, since the live board
    // needs isCommissioner/myTeamIds and the player pool to render correctly.
    await Promise.all([loadLeague(user), loadPlayers(), loadMyQueue()]);
    await loadDrafts();
    subscribeToPicks();
  }

  function renderSignedOut() {
    document.querySelector(".card").classList.remove("signed-in");
    appView.style.display = "none";
    loginView.style.display = "block";
    loginMsg.className = "msg";
    emailInput.value = "";
    passwordInput.value = "";
    if (picksChannel) {
      sb.removeChannel(picksChannel);
      picksChannel = null;
    }
  }

  function subscribeToPicks() {
    if (picksChannel) {
      sb.removeChannel(picksChannel);
    }
    picksChannel = sb
      .channel("picks-changes")
      .on("postgres_changes", { event: "*", schema: "public", table: "picks" }, () => {
        loadDrafts();
      if (currentDraftRoomId) loadDraftRoom();
      })
      .on("postgres_changes", { event: "*", schema: "public", table: "nominations" }, () => {
        loadDrafts();
      if (currentDraftRoomId) loadDraftRoom();
      })
      .on("postgres_changes", { event: "UPDATE", schema: "public", table: "drafts" }, () => {
        loadDrafts();
      if (currentDraftRoomId) loadDraftRoom();
      })
      .subscribe();
  }

  async function init() {
    // Confirm connectivity: a successful call to Supabase (even with no session) proves
    // the client can reach this project's Auth endpoint.
    const { data: { session }, error } = await sb.auth.getSession();
    if (error) {
      // Only surface this when something's actually wrong — a successful
      // connection needs no confirmation banner cluttering the login/app
      // header, but a real outage should be impossible to miss.
      connStatusLine.style.display = "flex";
      connDot.className = "status-dot error";
      connText.textContent = "⚠️ Could not reach Supabase: " + error.message;
    } else {
      connStatusLine.style.display = "none";
    }

    if (session && session.user) {
      renderSignedIn(session.user);
    } else {
      renderSignedOut();
    }
  }

  sb.auth.onAuthStateChange((_event, session) => {
    if (session && session.user) {
      renderSignedIn(session.user);
    } else {
      renderSignedOut();
    }
  });

  loginBtn.addEventListener("click", async () => {
    const email = emailInput.value.trim();
    const password = passwordInput.value;
    if (!email || !password) {
      showMsg("Enter both email and password.", "error");
      return;
    }
    loginBtn.disabled = true;
    loginBtn.textContent = "Signing in…";
    const { data, error } = await sb.auth.signInWithPassword({ email, password });
    loginBtn.disabled = false;
    loginBtn.textContent = "Sign In";
    if (error) {
      showMsg(error.message, "error");
    } else {
      showMsg("Signed in!", "success");
    }
  });

  passwordInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") loginBtn.click();
  });

  logoutBtn.addEventListener("click", async () => {
    await sb.auth.signOut();
  });

  formatSnakeBtn.addEventListener("click", () => {
    selectedFormat = "snake";
    formatSnakeBtn.classList.add("active");
    formatAuctionBtn.classList.remove("active");
    draftRoundsLabel.textContent = "Rounds per team";
    auctionFields.style.display = "none";
    if (isCommissioner) buildOrderRows();
  });

  formatAuctionBtn.addEventListener("click", () => {
    selectedFormat = "auction";
    formatAuctionBtn.classList.add("active");
    formatSnakeBtn.classList.remove("active");
    draftRoundsLabel.textContent = "Roster size per team (# of players)";
    auctionFields.style.display = "block";
    if (isCommissioner) buildOrderRows();
  });

  createDraftBtn.addEventListener("click", async () => {
    const label = draftLabelInput.value.trim();
    let startingBudget = null;

    const rounds = parseInt(draftRoundsInput.value, 10);
    if (!rounds || rounds < 1) {
      showDraftMsg("Enter a valid roster size.", "error");
      return;
    }

    if (selectedFormat === "auction") {
      startingBudget = parseFloat(draftBudgetInput.value);
      if (!startingBudget || startingBudget <= 0) {
        showDraftMsg("Enter a valid starting budget.", "error");
        return;
      }
    }

    const pickTimeSeconds = parseInt(draftPickSecondsInput.value, 10);
    if (!pickTimeSeconds || pickTimeSeconds < 10) {
      showDraftMsg("Enter a valid number of seconds per pick (10 or more).", "error");
      return;
    }

    const orderEntries = selectedFormat === "auction" ? allGms : allTeams;
    const orderIds = orderEntries.map((_, i) => document.getElementById("orderPos" + (i + 1)).value);
    const uniqueIds = new Set(orderIds);
    if (uniqueIds.size !== orderEntries.length) {
      showDraftMsg("Each " + (selectedFormat === "auction" ? "GM" : "team") + " must be assigned to exactly one pick position — you have a duplicate.", "error");
      return;
    }

    createDraftBtn.disabled = true;
    createDraftBtn.textContent = "Creating…";

    const { data: draft, error: draftError } = await sb
      .from("drafts")
      .insert({
        label: label || null,
        format: selectedFormat,
        rounds: rounds,
        starting_budget: startingBudget,
        pick_time_seconds: pickTimeSeconds,
        created_by: currentUser.id,
      })
      .select()
      .single();

    if (draftError) {
      showDraftMsg("Could not create draft: " + draftError.message, "error");
      createDraftBtn.disabled = false;
      createDraftBtn.textContent = "Create Draft";
      return;
    }

    const orderRowsPayload = orderIds.map((id, i) => ({
      draft_id: draft.id,
      team_id: selectedFormat === "auction" ? null : id,
      gm_id: selectedFormat === "auction" ? id : null,
      pick_position: i + 1,
    }));
    const { error: orderError } = await sb.from("draft_order").insert(orderRowsPayload);

    createDraftBtn.disabled = false;
    createDraftBtn.textContent = "Create Draft";

    if (orderError) {
      showDraftMsg("Draft created, but pick order failed to save: " + orderError.message, "error");
      loadDrafts();
      if (currentDraftRoomId) loadDraftRoom();
      return;
    }

    showDraftMsg("Draft created!", "success");
    draftLabelInput.value = "";
    draftRoundsInput.value = "";
    draftBudgetInput.value = "";
    loadDrafts();
  });

  // Open/close/select behavior for .custom-select widgets — a separate,
  // unconditional listener rather than another branch in the big delegated
  // one below, so opening/closing a dropdown never has to thread through
  // every existing button case there.
  document.addEventListener("click", (e) => {
    const toggle = e.target.closest(".custom-select-toggle");
    if (toggle) {
      const wrap = toggle.closest(".custom-select");
      const wasOpen = wrap.classList.contains("open");
      document.querySelectorAll(".custom-select.open").forEach((el) => el.classList.remove("open"));
      if (!wasOpen) wrap.classList.add("open");
      return;
    }

    const option = e.target.closest(".custom-select-option");
    if (option) {
      const wrap = option.closest(".custom-select");
      wrap.dataset.value = option.dataset.value;
      wrap.querySelector(".custom-select-label").textContent = option.textContent;
      wrap.querySelectorAll(".custom-select-option").forEach((o) => o.classList.toggle("selected", o === option));
      wrap.classList.remove("open");
      wrap.dispatchEvent(new CustomEvent("customselect:change"));
      return;
    }

    document.querySelectorAll(".custom-select.open").forEach((el) => el.classList.remove("open"));
  });

  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") {
      document.querySelectorAll(".custom-select.open").forEach((el) => el.classList.remove("open"));
    }
  });

  document.addEventListener("click", async (e) => {
    const starBtn = e.target.closest(".queue-star-btn");
    if (starBtn) {
      starBtn.disabled = true;
      await toggleQueue(starBtn.dataset.playerId);
      return;
    }

    const enterBtn = e.target.closest(".enter-draft-room-btn");
    if (enterBtn) {
      openDraftRoom(enterBtn.dataset.draftId);
      return;
    }

    const startBtn = e.target.closest(".start-draft-btn");
    if (startBtn) {
      startBtn.disabled = true;
      startBtn.textContent = "Starting…";
      const { error } = await sb
        .from("drafts")
        .update({ status: "in_progress", started_at: new Date().toISOString() })
        .eq("id", startBtn.dataset.draftId);
      if (error) {
        alert("Could not start draft: " + error.message);
      }
      loadDrafts();
      if (currentDraftRoomId) loadDraftRoom();
      return;
    }

    const draftBtn = e.target.closest(".draft-player-btn");
    if (draftBtn) {
      draftBtn.disabled = true;
      draftBtn.textContent = "Drafting…";
      const { error } = await sb.from("picks").insert({
        draft_id: draftBtn.dataset.draftId,
        team_id: draftBtn.dataset.teamId,
        player_id: draftBtn.dataset.playerId,
        pick_number: parseInt(draftBtn.dataset.pickNumber, 10),
        round: parseInt(draftBtn.dataset.round, 10),
      });
      if (error) {
        alert("Could not record pick: " + error.message);
      }
      loadDrafts();
      if (currentDraftRoomId) loadDraftRoom();
      return;
    }

    const nominateBtn = e.target.closest(".nominate-player-btn");
    if (nominateBtn) {
      nominateBtn.disabled = true;
      nominateBtn.textContent = "Nominating…";
      const { error } = await sb.from("nominations").insert({
        draft_id: nominateBtn.dataset.draftId,
        nomination_number: parseInt(nominateBtn.dataset.nominationNumber, 10),
        player_id: nominateBtn.dataset.playerId,
        nominated_by_gm_id: nominateBtn.dataset.gmId,
        current_bid: 1,
        current_bid_gm_id: nominateBtn.dataset.gmId,
        status: "open",
      });
      if (error) {
        alert("Could not nominate player: " + error.message);
      }
      loadDrafts();
      if (currentDraftRoomId) loadDraftRoom();
      return;
    }

    const assignBtn = e.target.closest(".assign-pick-team-btn");
    if (assignBtn) {
      const select = document.getElementById(assignBtn.dataset.selectId);
      assignBtn.disabled = true;
      const { error } = await sb
        .from("picks")
        .update({ team_id: select.dataset.value })
        .eq("id", assignBtn.dataset.pickId);
      if (error) {
        alert("Could not assign player to a team: " + error.message);
        assignBtn.disabled = false;
      }
      loadDrafts();
      if (currentDraftRoomId) loadDraftRoom();
      return;
    }

    const stepBtn = e.target.closest(".bid-step-btn");
    if (stepBtn) {
      const input = document.getElementById("bidAmountInput");
      const offerBtn = document.querySelector(".place-bid-btn");
      const step = parseInt(stepBtn.dataset.step, 10);
      const min = parseInt(input.min, 10);
      const current = parseInt(input.value, 10) || min;
      const newVal = Math.max(min, current + step);
      input.value = newVal;
      if (offerBtn) offerBtn.textContent = "Offer $" + newVal;
      return;
    }

    const bidBtn = e.target.closest(".place-bid-btn");
    if (bidBtn) {
      const amountInput = document.getElementById("bidAmountInput");
      const currentBid = parseFloat(bidBtn.dataset.currentBid);
      const amount = parseFloat(amountInput.value);

      if (!amount || amount <= currentBid) {
        alert("Bid must be higher than the current bid of $" + currentBid + ".");
        return;
      }
      if (currentUser.id === bidBtn.dataset.currentBidGmId) {
        alert("You already have the highest bid — wait for someone else to bid.");
        return;
      }

      bidBtn.disabled = true;
      bidBtn.textContent = "Bidding…";
      const { data, error } = await sb
        .from("nominations")
        .update({ current_bid: amount, current_bid_gm_id: currentUser.id, last_bid_at: new Date().toISOString() })
        .eq("id", bidBtn.dataset.nominationId)
        .eq("current_bid", currentBid)
        .select();

      if (error) {
        alert("Could not place bid: " + error.message);
      } else if (!data || data.length === 0) {
        alert("Someone else just bid first — refreshing with the latest bid.");
      }
      loadDrafts();
      if (currentDraftRoomId) loadDraftRoom();
      return;
    }

    const timerSaveBtn = e.target.closest(".timer-seconds-save-btn");
    if (timerSaveBtn) {
      const input = document.getElementById("timerSeconds-" + timerSaveBtn.dataset.draftId);
      const seconds = parseInt(input.value, 10);
      if (!seconds || seconds < 10) {
        alert("Enter a valid number of seconds (10 or more).");
        return;
      }
      timerSaveBtn.disabled = true;
      const { error } = await sb
        .from("drafts")
        .update({ pick_time_seconds: seconds })
        .eq("id", timerSaveBtn.dataset.draftId);
      timerSaveBtn.disabled = false;
      if (error) {
        alert("Could not update pick timer: " + error.message);
      }
      loadDrafts();
      if (currentDraftRoomId) loadDraftRoom();
      return;
    }

    const toggleBtn = e.target.closest(".toggle-details-btn");
    if (toggleBtn) {
      const id = toggleBtn.dataset.draftId;
      if (expandedDraftIds.has(id)) {
        expandedDraftIds.delete(id);
      } else {
        expandedDraftIds.add(id);
      }
      loadDrafts();
      if (currentDraftRoomId) loadDraftRoom();
      return;
    }

    const cancelBtn = e.target.closest(".cancel-draft-btn");
    if (cancelBtn) {
      if (!confirm("Cancel this draft? This can't be undone.")) return;
      cancelBtn.disabled = true;
      const { error } = await sb
        .from("drafts")
        .update({ status: "cancelled" })
        .eq("id", cancelBtn.dataset.draftId);
      if (error) {
        alert("Could not cancel draft: " + error.message);
      }
      loadDrafts();
      if (currentDraftRoomId) loadDraftRoom();
      return;
    }

    const deleteBtn = e.target.closest(".delete-draft-btn");
    if (deleteBtn) {
      if (!confirm("Permanently delete this draft, its pick order, and all its picks? This can't be undone.")) return;
      deleteBtn.disabled = true;
      const { error } = await sb.from("drafts").delete().eq("id", deleteBtn.dataset.draftId);
      if (error) {
        alert("Could not delete draft: " + error.message);
      }
      loadDrafts();
    }
  });

  // Launch splash: shows on every load. Purely decorative, so it never
  // blocks init() from running underneath it.
  (function () {
    const splashScreen = document.getElementById("splashScreen");
    const dismiss = () => {
      splashScreen.classList.add("hidden");
      setTimeout(() => splashScreen.remove(), 400);
    };
    splashScreen.addEventListener("click", dismiss);
    setTimeout(dismiss, 2500);
  })();

  init();
</script>

</body>
</html>
