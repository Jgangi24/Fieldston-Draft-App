<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fieldston Core Four — Draft App</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    color-scheme: light dark;
    --bg: #0f1115;
    --card: #1a1d24;
    --border: #2a2e37;
    --text: #e8e9ec;
    --muted: #9aa0ab;
    --accent: #4f8cff;
    --accent-hover: #6ba0ff;
    --error: #ff6b6b;
    --success: #4fdb8a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 16px;
  }
  .card {
    width: 100%;
    max-width: 380px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 32px;
  }
  h1 {
    font-size: 20px;
    margin: 0 0 4px;
  }
  .subtitle {
    color: var(--muted);
    font-size: 13px;
    margin: 0 0 24px;
  }
  label {
    display: block;
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 6px;
  }
  input {
    width: 100%;
    padding: 10px 12px;
    margin-bottom: 16px;
    background: #0f1115;
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 14px;
  }
  input:focus {
    outline: none;
    border-color: var(--accent);
  }
  button {
    width: 100%;
    padding: 11px;
    background: var(--accent);
    border: none;
    border-radius: 8px;
    color: white;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover { background: var(--accent-hover); }
  button:disabled { opacity: 0.5; cursor: default; }
  button.secondary {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
    margin-top: 12px;
  }
  button.secondary:hover { background: var(--border); }
  .msg {
    font-size: 13px;
    margin-top: 14px;
    padding: 10px 12px;
    border-radius: 8px;
    display: none;
  }
  .msg.error { display: block; background: rgba(255,107,107,0.1); color: var(--error); border: 1px solid rgba(255,107,107,0.3); }
  .msg.success { display: block; background: rgba(79,219,138,0.1); color: var(--success); border: 1px solid rgba(79,219,138,0.3); }
  .status-dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    margin-right: 6px;
  }
  .status-dot.ok { background: var(--success); }
  .status-dot.pending { background: var(--muted); }
  .status-line {
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 24px;
    display: flex;
    align-items: center;
  }
  .welcome {
    text-align: center;
  }
  .welcome .name {
    font-size: 24px;
    font-weight: 700;
    margin: 8px 0 4px;
  }
  .welcome .email {
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 20px;
  }
  #loginView, #appView { display: none; }
</style>
</head>
<body>

<div class="card">
  <div class="status-line">
    <span id="connDot" class="status-dot pending"></span>
    <span id="connText">Checking Supabase connection…</span>
  </div>

  <div id="loginView">
    <h1>Fieldston Core Four</h1>
    <p class="subtitle">Fantasy League Draft App — sign in</p>

    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="username" placeholder="you@example.com">

    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password" placeholder="••••••••">

    <button id="loginBtn">Sign In</button>

    <div id="loginMsg" class="msg"></div>
  </div>

  <div id="appView">
    <div class="welcome">
      <div style="font-size:13px;color:var(--muted);">✅ Connected to Supabase</div>
      <div class="name" id="gmName">—</div>
      <div class="email" id="gmEmail">—</div>
      <button id="logoutBtn" class="secondary">Sign Out</button>
    </div>
  </div>
</div>

<script>
  const SUPABASE_URL = "https://nzydysnununphiobnirq.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_1G76RJgZH-JcOeC2r6etAg_DBNZCGGJ";

  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const GM_NAMES = {
    "jessgangi@gmail.com": "Jess",
    "mweston08@gmail.com": "Mike",
    "paulbcharney@gmail.com": "Paul",
    "lkrauskopf@yahoo.com": "Lew",
  };

  const connDot = document.getElementById("connDot");
  const connText = document.getElementById("connText");
  const loginView = document.getElementById("loginView");
  const appView = document.getElementById("appView");
  const loginBtn = document.getElementById("loginBtn");
  const logoutBtn = document.getElementById("logoutBtn");
  const loginMsg = document.getElementById("loginMsg");
  const emailInput = document.getElementById("email");
  const passwordInput = document.getElementById("password");
  const gmName = document.getElementById("gmName");
  const gmEmail = document.getElementById("gmEmail");

  function showMsg(text, type) {
    loginMsg.textContent = text;
    loginMsg.className = "msg " + type;
  }

  function displayNameFor(user) {
    return GM_NAMES[user.email] || user.email;
  }

  function renderSignedIn(user) {
    loginView.style.display = "none";
    appView.style.display = "block";
    gmName.textContent = displayNameFor(user);
    gmEmail.textContent = user.email;
  }

  function renderSignedOut() {
    appView.style.display = "none";
    loginView.style.display = "block";
    loginMsg.className = "msg";
    emailInput.value = "";
    passwordInput.value = "";
  }

  async function init() {
    // Confirm connectivity: a successful call to Supabase (even with no session) proves
    // the client can reach this project's Auth endpoint.
    const { data: { session }, error } = await sb.auth.getSession();
    if (error) {
      connDot.className = "status-dot";
      connText.textContent = "⚠️ Could not reach Supabase: " + error.message;
    } else {
      connDot.className = "status-dot ok";
      connText.textContent = "Connected to Supabase project (nzydysnununphiobnirq)";
    }

    if (session && session.user) {
      renderSignedIn(session.user);
    } else {
      renderSignedOut();
    }
  }

  sb.auth.onAuthStateChange((_event, session) => {
    if (session && session.user) {
      renderSignedIn(session.user);
    } else {
      renderSignedOut();
    }
  });

  loginBtn.addEventListener("click", async () => {
    const email = emailInput.value.trim();
    const password = passwordInput.value;
    if (!email || !password) {
      showMsg("Enter both email and password.", "error");
      return;
    }
    loginBtn.disabled = true;
    loginBtn.textContent = "Signing in…";
    const { data, error } = await sb.auth.signInWithPassword({ email, password });
    loginBtn.disabled = false;
    loginBtn.textContent = "Sign In";
    if (error) {
      showMsg(error.message, "error");
    } else {
      showMsg("Signed in!", "success");
    }
  });

  passwordInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") loginBtn.click();
  });

  logoutBtn.addEventListener("click", async () => {
    await sb.auth.signOut();
  });

  init();
</script>

</body>
</html>
